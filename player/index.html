<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PicoFake8 Player</title><style>html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#app{width:min(100vw,100vh*1.7778);height:min(100vh,56.25vw);position:relative;background:#000}canvas{width:100%;height:100%;image-rendering:pixelated;display:block}#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:3}button{background:#222;color:#fff;border:1px solid #777;border-radius:6px;padding:7px 10px}#file{display:none}#status{font-size:12px;background:#000b;padding:7px;border-radius:6px}.touch{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;z-index:2}.pad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;gap:3px}.pad button,.ab button{width:46px;height:46px;border-radius:50%;padding:0;background:#222b}.u{grid-column:2}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}.ab{display:flex;gap:8px;align-items:end}@media(pointer:coarse){.touch{display:flex}}</style></head><body><div id="app"><canvas id="screen" width="128" height="128"></canvas><div id="bar"><button id="load">LOAD CARTRIDGE</button><input id="file" type="file" accept=".p8,.png,image/png,text/plain"><button id="full">FULLSCREEN</button><span id="status">Ready • Keyboard: arrows/WASD + Z/X + Enter/Esc</span></div><div class="touch"><div class="pad"><button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button><button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button></div><div class="ab"><button data-k="b">B</button><button data-k="a">A</button></div></div></div><script>
"use strict";
const c=document.getElementById("screen"),x=c.getContext("2d"),W=128,H=128;
x.imageSmoothingEnabled=false;
const C=["#000000","#1d2b53","#7e2553","#008751","#ab5236","#5f574f","#c2c3c7","#fff1e8","#ff004d","#ffa300","#ffec27","#00e436","#29adff","#83769c","#ff77a8","#ffccaa"];
let K={},P={},cart=null,running=false,raf=0;
const km={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down",z:"a",c:"a",x:"b",v:"b",Enter:"start",Escape:"select"};
addEventListener("keydown",e=>{let k=km[e.key]||km[e.key.toLowerCase()];if(k){if(!K[k])P[k]=true;K[k]=true;e.preventDefault()}});
addEventListener("keyup",e=>{let k=km[e.key]||km[e.key.toLowerCase()];if(k){K[k]=false;e.preventDefault()}});
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(!K[k])P[k]=true;K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false});
function col(n){x.fillStyle=C[(n==null?6:n)&15]} function cls(n){col(n||0);x.fillRect(0,0,W,H)}
function rectfill(a,b,w,h,n){col(n);x.fillRect(a|0,b|0,w|0,h|0)} function rect(a,b,w,h,n){rectfill(a,b,w,h,n)}
function pset(a,b,n){rectfill(a,b,1,1,n)} function line(a,b,d,e,n){col(n);x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function circfill(a,b,r,n){col(n);x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}
function print(t,a,b,n){col(n);x.font="6px monospace";x.textBaseline="top";x.fillText(String(t),a|0,b|0)}
function btn(n){let q=["left","right","up","down","a","b","x","y","menu","start","select"];return !!K[q[n]||n]}
function time(){return performance.now()/1000} function rnd(n){return Math.random()*(n||1)} function flr(n){return Math.floor(n)} function mid(a,b,d){return Math.max(a,Math.min(d,b))}
function add(a,b){return a+b} function del(){ } function sfx(){ } function music(){ } function camera(){ } function clip(){ } function pal(){ }
function map(){ } function spr(){ } function sspr(){ } function mset(){ } function mget(){return 0} function fget(){return 0}
function extract(s){const i=s.indexOf("__lua__");if(i<0)throw Error("No __lua__ section found. This is not a readable .p8 cartridge.");return s.slice(i+7).replace(/^\n/,"");}
function readBitsFactory(buf){let p=0,b=1;return{bit(){let v=(buf[p]&b)?1:0;b<<=1;if(b===256){b=1;p++}return v},val(n){let v=0;for(let i=0;i<n;i++)if(this.bit())v|=1<<i;return v},pos(){return p}}}
function getChain(r,linkBits,maxBits){const max=(1<<linkBits)-1;let value=0,v=max,bits=0;while(v===max){v=r.val(linkBits);value+=v;bits+=linkBits;if(bits>=maxBits)return value}return value}
function pxaDecompress(src){const r=readBitsFactory(src),head=[];for(let i=0;i<8;i++)head.push(r.val(8));if(head[0]!==0||head[1]!==112||head[2]!==120||head[3]!==97)throw Error("Invalid PXA header");const rawLen=head[4]*256+head[5],compLen=head[6]*256+head[7],out=new Uint8Array(rawLen),lit=new Uint8Array(256);for(let i=0;i<256;i++)lit[i]=i;let n=0;while(r.pos()<compLen&&n<rawLen){const type=r.bit();if(type===0){const jumpBits=(3-getChain(r,1,2))*5;const offv=r.val(jumpBits);if(offv===0&&jumpBits===10){while(n<rawLen){const v=r.val(8);if(v===0)break;out[n++]=v}}else{const off=offv+1;let len=getChain(r,3,100000)+3;while(len-->0&&n<rawLen){out[n]=out[n-off];n++}}}else{let lpos=0,bits=0;while(r.bit()===1&&bits<16){lpos+=1<<(4+bits);bits++}bits+=4;lpos+=r.val(bits);if(lpos>255)throw Error("Invalid PXA literal");const ch=lit[lpos];out[n++]=ch;for(let i=lpos;i>0;i--)lit[i]=lit[i-1];lit[0]=ch}}return new TextDecoder().decode(out)}
function miniDecompress(src){const lit="^\\n 0123456789abcdefghijklmnopqrstuvwxyz!#%(){}[]<>+=/*:;.,~_";let p=8,out=[];const len=src[4]*256+src[5];while(out.length<len){let v=src[p++];if(v<60){if(v===0)out.push(src[p++]);else out.push(lit.charCodeAt(v))}else{const off=(v-60)*16+(src[p++]&15),n=(src[p-1]>>4)+2;for(let i=0;i<n;i++)out.push(out[out.length-off])}}return new TextDecoder().decode(new Uint8Array(out))}
async function decodeP8Png(file){const url=URL.createObjectURL(file);try{const img=new Image();img.decoding="async";await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(Error("The cartridge PNG could not be decoded by this browser."));img.src=url});if(img.naturalWidth!==160||img.naturalHeight!==205)throw Error("Not a valid PICO-8 .p8.png cartridge (expected 160×205).");const cv=document.createElement("canvas");cv.width=160;cv.height=205;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0);const d=cx.getImageData(0,0,160,205).data,rom=new Uint8Array(32800);let o=0;for(let i=0;i<d.length&&o<rom.length;i+=4){rom[o++]=((d[i+3]&3)<<6)|((d[i]&3)<<4)|((d[i+1]&3)<<2)|(d[i+2]&3)}if(o<32768)throw Error("Cartridge image data is incomplete.");const code=rom.slice(0x4300,0x8000);if(code[0]===0&&code[1]===112&&code[2]===120&&code[3]===97)return pxaDecompress(code);if(code[0]===58&&code[1]===99&&code[2]===58&&code[3]===0)return miniDecompress(code);let end=0;while(end<code.length&&code[end]!==0)end++;return new TextDecoder().decode(code.slice(0,end))}finally{URL.revokeObjectURL(url)}}

function compile(src){
 let s=src.replace(/\r/g,"").replace(/--.*$/gm,"");
 s=s.replace(/\btrue\b/g,"true").replace(/\bfalse\b/g,"false").replace(/\bnil\b/g,"null");\n s=s.replace(/\^/g,"**");
 s=s.replace(/~= /g,"!==").replace(/~=/g,"!==").replace(/\band\b/g,"&&").replace(/\bor\b/g,"||").replace(/\bnot\b/g,"!");
 s=s.replace(/function\s+(_init|_update60|_update|_draw)\s*\(([^)]*)\)/g,"function $1($2){");
 s=s.replace(/\bfunction\s+([A-Za-z_]\w*)\s*\(([^)]*)\)/g,"function $1($2){");
 s=s.replace(/\bif\s+(.+?)\s+then\b/g,"if ($1){").replace(/\belseif\s+(.+?)\s+then\b/g,"}else if ($1){").replace(/\belse\b/g,"}else{").replace(/\bend\b/g,"}");
 s=s.replace(/\blocal\s+/g,"let ");
 s=s.replace(/\bfor\s+(\w+)\s*=\s*([^,]+),\s*([^\n]+)\s+do/g,"for(let $1=$2;$1<=$3;$1++){");
 s=s.replace(/\brectfill\b/g,"rectfill").replace(/\bcircfill\b/g,"circfill");
 try{return new Function(s+";return {i:typeof _init==='function'?_init:null,u:typeof _update==='function'?_update:null,u60:typeof _update60==='function'?_update60:null,d:typeof _draw==='function'?_draw:null};")()}catch(e){throw Error("Lua compatibility error: "+e.message)}
}
function load(s){try{cart=compile(extract(s));if(!cart.d&&!cart.u&&!cart.u60)throw Error("No _draw/_update function found.");if(cart.i)cart.i();running=true;document.getElementById("status").textContent="Running";cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}catch(e){running=false;document.getElementById("status").textContent=e.message}}
function loop(){if(!running)return;try{if(cart.u60)cart.u60();else if(cart.u)cart.u();if(cart.d)cart.d();P={}}catch(e){running=false;document.getElementById("status").textContent="Runtime error: "+e.message}raf=requestAnimationFrame(loop)}
cls(0);print("PicoFake8",44,55,7);print("LOAD .P8",48,64,6);
document.getElementById("load").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{document.getElementById("status").textContent="Loading cartridge…";if(/\.p8\.png$/i.test(f.name)||f.type==="image/png"){const lua=await decodeP8Png(f);load("__lua__\\n"+lua)}else{load(await f.text())}}catch(err){document.getElementById("status").textContent="Cartridge error: "+err.message}};
document.getElementById("full").onclick=()=>document.getElementById("app").requestFullscreen?.();
</script></body></html>
