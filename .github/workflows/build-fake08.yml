name: Build upstream FAKE-08 Web core

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-fake08.yml"
      - "web/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PicoFake8
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.18

      - name: Checkout upstream FAKE-08
        run: |
          git clone --recurse-submodules https://github.com/jtothebell/fake-08.git upstream/fake-08
          cd upstream/fake-08
          git submodule update --init --recursive

      - name: Build upstream FAKE-08 libretro objects
        working-directory: upstream/fake-08/platform/libretro
        env:
          EMCC_CFLAGS: "-sSUPPORT_LONGJMP=emscripten -fexceptions"
        run: |
          emmake make platform=emscripten clean || true
          emmake make platform=emscripten -j2 || true

          OBJS=$(find ../.. -name "*.o")
          COUNT=$(printf "%s\n" "$OBJS" | grep -c . || true)
          if [ "$COUNT" -lt 40 ]; then
            echo "FAKE-08 object build failed: only $COUNT objects were produced."
            exit 1
          fi

          emar rcs fake08_libretro.a $OBJS

      - name: Link upstream FAKE-08 into browser WASM
        working-directory: upstream/fake-08/platform/libretro
        run: |
          mkdir -p ../../../web/fake08

          emcc fake08_libretro.a \
            -O2 \
            -fexceptions \
            -sSUPPORT_LONGJMP=emscripten \
            -sWASM=1 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sEXPORT_NAME=create_fake08 \
            -sENVIRONMENT=web \
            -sALLOW_MEMORY_GROWTH=1 \
            -sINITIAL_MEMORY=33554432 \
            -sMAXIMUM_MEMORY=268435456 \
            -sALLOW_TABLE_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_retro_api_version","_retro_init","_retro_deinit","_retro_set_environment","_retro_set_video_refresh","_retro_set_audio_sample","_retro_audio_sample_batch","_retro_set_audio_sample_batch","_retro_set_input_poll","_retro_set_input_state","_retro_get_system_info","_retro_get_system_av_info","_retro_load_game","_retro_unload_game","_retro_run","_retro_reset","_retro_serialize_size","_retro_serialize","_retro_unserialize","_retro_cheat_reset","_retro_cheat_set","_retro_get_memory_data","_retro_get_memory_size","_retro_get_region","_retro_set_controller_port_device","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap","addFunction","removeFunction","HEAPU8","HEAPU16","HEAPU32","HEAP16","HEAP32","HEAPF32","UTF8ToString","stringToUTF8","lengthBytesUTF8","getValue","setValue","FS"]' \
            -sFILESYSTEM=1 \
            -sINVOKE_RUN=0 \
            -o ../../../web/fake08/fake08.js

      - name: Copy upstream license
        run: cp upstream/fake-08/LICENSE.MD web/fake08/LICENSE.MD

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake08-web-core
          path: |
            web/fake08/fake08.js
            web/fake08/fake08.wasm
            web/fake08/LICENSE.MD
